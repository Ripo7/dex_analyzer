[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dex-analyser"
version = "0.1.0"
description = "Analyse Twitter/X trends and cross-reference with DexScreener token data"
requires-python = ">=3.10"
dependencies = [
    "ntscraper>=0.3.6",
    "requests>=2.31",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-mock>=3.12"]

[project.scripts]
dex-analyser = "dex_analyser.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
