[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dex-analyser"
version = "0.2.0"
description = "Rank trending on-chain tokens via DexScreener discovery metrics"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "rich>=13.0",
    "discord.py>=2.3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-mock>=3.12"]

[project.scripts]
dex-analyser = "dex_analyser.cli:main"
dex-analyser-bot = "dex_analyser.bot:run"

[tool.setuptools.packages.find]
where = ["src"]
